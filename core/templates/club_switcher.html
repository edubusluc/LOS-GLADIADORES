{% if current_club %}
  {% if user_memberships|length > 1 %}
  <form action="{% url 'switch_club' %}" method="post" class="d-inline">
    {% csrf_token %}
    <select name="club_id" class="form-select" onchange="this.form.submit()" aria-label="Club activo">
      {% for m in user_memberships %}
      <option value="{{ m.club_id }}" {% if m.club_id == current_club.id %}selected{% endif %}>{{ m.club.name }}</option>
      {% endfor %}
    </select>
  </form>
  {% else %}
  <span class="text-light fw-bold">{{ current_club.name }}</span>
  {% endif %}
{% endif %}
