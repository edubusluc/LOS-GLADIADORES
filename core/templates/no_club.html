{% extends 'base.html' %}
{% load static i18n %}

{% block content %}
<div class="z-auth">
    <div class="z-auth-card text-center">
        <img src="{% static 'zyra/logo.svg' %}" alt="" class="z-auth-logo">
        <h1>{% translate "Sin club" %}</h1>
        <p class="text-muted">{% translate "Todavía no perteneces a ningún club. Pide a un capitán que te añada como miembro, o registra un club nuevo." %}</p>
        <a class="btn btn-primary btn-lg" href="{% url 'register_club' %}">{% translate "Registrar un club" %}</a>
    </div>
</div>
{% endblock %}
