{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="z-auth">
    <div class="z-auth-card text-center">
        <img src="{% static 'zyra/logo.svg' %}" alt="" class="z-auth-logo">
        <h1>Sin club</h1>
        <p class="text-muted">Todavía no perteneces a ningún club. Pide a un administrador que te añada como miembro, o registra un club nuevo.</p>
        <a class="btn btn-primary btn-lg" href="{% url 'register_club' %}">Registrar un club</a>
    </div>
</div>
{% endblock %}
