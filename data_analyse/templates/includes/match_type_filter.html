{% load i18n %}
{# Filtro por tipo de partido. Recibe match_types y competitive_types de data_analyse.views.match_type_context. #}
<nav aria-label="{% translate 'Tipo de partido' %}" class="st-type-filter">
  <ul class="st-seasons">
    <li class="st-filter-label">{% translate "Partidos" %}</li>
    {% for option in match_types %}
      <li><a class="st-chip" href="{{ option.url }}" {% if option.active %}aria-current="page"{% endif %}>{{ option.label }}</a></li>
    {% endfor %}
  </ul>
  {% if competitive_types %}
  <div class="st-type-select">
    <label for="competitive-type" class="visually-hidden">{% translate "Tipo de partido competitivo" %}</label>
    <select id="competitive-type" onchange="window.location.href = this.value">
      {% for option in competitive_types %}
      <option value="{{ option.url }}" {% if option.active %}selected{% endif %}>{{ option.label }}</option>
      {% endfor %}
    </select>
  </div>
  {% endif %}
</nav>
