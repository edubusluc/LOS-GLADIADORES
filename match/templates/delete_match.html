{% extends 'base.html' %}

{% block content %}
<div class="z-auth">
    <div class="z-auth-card text-center">
        <h1>Eliminar partido</h1>
        <p class="text-muted">Vas a eliminar el partido entre <strong class="text-white">{{ match.local }}</strong> y <strong class="text-white">{{ match.visiting }}</strong>. Esta acción no se puede deshacer.</p>
        <form method="POST" class="d-grid gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Eliminar</button>
            <a href="{% url 'list_match' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
