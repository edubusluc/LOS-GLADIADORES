{% extends 'base.html' %}

{% block content %}
<div class="z-auth">
    <div class="z-auth-card text-center">
        <h1>Eliminar jugador</h1>
        <p class="text-muted">¿Seguro que quieres eliminar a "{{ player.name }}"?</p>
        <form method="POST" class="d-grid gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Eliminar</button>
            <a href="{% url 'list_players' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
