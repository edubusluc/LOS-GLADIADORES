{% extends 'base.html' %}
{% load static i18n %}

{% block content %}
    <div class="table-container">
    <h1>{% translate "Editar Jugador" %}</h1>
    
    <form method="POST" action="{% url 'edit_player' player.public_id %}">
        {% csrf_token %}
        
        <div>
            <label for="name">{% translate "Nombre:" %}</label>
            <input type="text" id="name" name="name" value="{{ player.name }}" required>
        </div>

        <div>
            <label for="last_name">{% translate "Apellidos:" %}</label>
            <input type="text" id="last_name" name="last_name" value="{{ player.last_name }}" required>
        </div>
    
        <div>
            <label for="position">{% translate "Posición:" %}</label>
            <select id="position" name="position" required>
                {% for value, display in positions %}
                    <option value="{{ value }}" {% if player.position == value %}selected{% endif %}>{{ display }}</option>
                {% endfor %}
            </select>
        </div>
    
        <div>
            <label for="skillfull_hand">{% translate "Mano hábil:" %}</label>
            <select id="skillfull_hand" name="skillfull_hand" required>
                {% for value, display in hands %}
                    <option value="{{ value }}" {% if player.skillfull_hand == value %}selected{% endif %}>{{ display }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="joined_season">{% translate "Temporada en la que se unió al equipo:" %}</label>
            <input type="text" id="joined_season" name="joined_season" value="{{ player.joined_season }}" required>
        </div>
        
        <div>
            <input type="checkbox" id="in_team" name="in_team" {% if player.in_team %}checked{% endif %}>
            <label for="in_team">{% translate "¿Se encuentra en el equipo?" %}</label>
        </div>
        
        <button type="submit" class="btn btn-primary">{% translate "Guardar" %}</button>
    </form>
</div>
{% endblock %}
